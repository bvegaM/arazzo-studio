# Schemas compartidos, referenciados desde members.yaml con $ref externos.
NewMember:
  type: object
  required: [email, firstName]
  properties:
    email: { type: string, format: email }
    firstName: { type: string, minLength: 1 }
Member:
  type: object
  required: [member, miles]
  properties:
    member:
      $ref: '#/MemberData'
    miles: { type: integer, minimum: 0 }
    benefits:
      type: array
      items: { type: string }
MemberData:
  type: object
  required: [id, tier]
  properties:
    id: { type: string }
    tier: { type: string, enum: [BLUE, SILVER, GOLD] }
Error:
  type: object
  required: [code]
  properties:
    code: { type: string }
    message: { type: string }
